CONFIG_TEE=y
CONFIG_OPTEE=y
### Enable 9P VFS
CONFIG_NET_9P=y
CONFIG_NET_9P_VIRTIO=y
CONFIG_9P_FS=y
CONFIG_9P_FS_POSIX_ACL=y
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_VIRTIO=y
CONFIG_EFI_GENERIC_STUB_INITRD_CMDLINE_LOADER=y
CONFIG_GDB_SCRIPTS=y
CONFIG_KEYS=y
CONFIG_TRUSTED_KEYS=y
CONFIG_ENCRYPTED_KEYS=y
CONFIG_ARM_FFA_TRANSPORT=y
CONFIG_TCG_TPM=y
CONFIG_TCG_FTPM_TEE=y
#CONFIG_INTEGRITY=y
#CONFIG_IMA=y

CONFIG_SECURITY=y
CONFIG_INTEGRITY=y
CONFIG_IMA=y
CONFIG_IMA_MEASURE_PCR_IDX=10
CONFIG_IMA_DEFAULT_HASH_SHA256=y
CONFIG_IMA_LSM_RULES=y

CONFIG_IMA_APPRAISE=n

# Per non vedere solo il boot aggregate
CONFIG_IMA_ARCH_POLICY=y
# permette di avere privilegi di lettura per la ima policy
CONFIG_IMA_READ_POLICY=y



# prova per misurare tutto
CONFIG_IMA_WRITE_POLICY=y

CONFIG_IMA_MEASURE_ASYMMETRIC_KEYS=y
CONFIG_IMA_QUEUE_EARLY_BOOT_KEYS=y


# prova ancora
CONFIG_KEXEC_SIG=y

CONFIG_INTEGRITY_SIGNATURE=y

CONFIG_INTEGRITY_ASYMMETRIC_KEYS=y
CONFIG_IMA_ARCH_POLICY=y

# ancora ...
CONFIG_IMA_KEXEC=y

# questi tre dovrebbero abilitare
# CONFIG_IMA_LSM_RULES=y
CONFIG_AUDIT=y
CONFIG_SECURITY_NETWORK=y
CONFIG_SECURITY_SELINUX=y


# aggiungo anche questo (ma dovrebbe essere ridondante)
CONFIG_SECURITYFS=y

#CONFIG_USE_DEFAULT_ENV_FILE=console=ttyAMA0,115200 earlyprintk=serial,ttyAMA0,115200 ima=on ima_policy=tcb ima_template=ima-ng ima_hash=sha256 ima_appraise=off

# prova a attivare TPM (evitare tpm-bypass)
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS=y
CONFIG_TCG_TPM2=y

# provaaa chat
CONFIG_IMA_MEASURE=y
CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,selinux,smack,tomoyo,apparmor,ipe,bpf,integrity,ima"
#CONFIG_LSM="integrity,ima"




BR2_PACKAGE_DROPBEAR=y


CONFIG_PKILL=y

# Prova qui ancora
BR2_PACKAGE_PROCPS_NG=y
