CONFIG_TEXT_BASE=0x60000000
CONFIG_BOOTCOMMAND="fdt addr ${fdt_addr} && fdt resize 1000 && load hostfs - ${kernel_addr_r} zImage && load hostfs - ${ramdisk_addr_r} rootfs.cpio.gz && setenv bootargs console=ttyAMA0,115200 earlyprintk=serial,ttyAMA0,115200 ima_policy=tcb && fdt chosen ${ramdisk_addr_r} ${filesize} && bootz ${kernel_addr_r} - ${fdt_addr}"
CONFIG_SEMIHOSTING=y
CONFIG_ENV_IS_NOWHERE=y
# CONFIG_ENV_IS_IN_FLASH is not set
# CONFIG_MTD is not set
# CONFIG_MTD_NOR_FLASH is not set



# Setto anche qui tutte le CONFIG
CONFIG_IMA=y
CONFIG_IMA_MEASURE_PCR_IDX=10
CONFIG_IMA_LSM_RULES=y
CONFIG_IMA_DEFAULT_HASH_SHA256=y
CONFIG_INTEGRITY=y
CONFIG_SECURITY=y

CONFIG_IMA_APPRAISE=n
CONFIG_IMA_MEASURE=y

# Prova a far prendere la pkill
CONFIG_PKILL=y
